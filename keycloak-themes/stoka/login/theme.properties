# ============================================================================
# theme.properties — Tema de Keycloak "stoka", SOLO para las pantallas de
# login (registro, "olvidé mi contraseña", errores, etc. — todo lo que
# Keycloak sirve el mismo, fuera de la app de Next.js).
#
# "parent=keycloak" hereda TODO del tema base — login.ftl, template.ftl,
# la logica de MFA/WebAuthn/reCAPTCHA si estan activos, etc. A proposito NO
# se sobreescribe ningun .ftl (esos archivos son criticos para la seguridad
# del login y cambian entre versiones de Keycloak — copiarlos mal podria
# romper el login de verdad). Este tema solo AGREGA CSS/JS encima, sin
# tocar nada de lo que ya funciona.
#
# OJO con "styles": a diferencia de "import"/"stylesCommon", la propiedad
# "styles" de un tema hijo NO se suma a la del padre, la REEMPLAZA entera —
# si aca solo hubiera puesto nuestro propio CSS, el "css/login.css" del
# tema "keycloak" base (el que centra la tarjeta, le pone sombra, fondo,
# tamaños de fuente, etc.) se hubiera perdido por completo, dejando el
# login prácticamente sin estilo (esto es justamente lo que pasaba antes:
# se veía "pésimo" porque la hoja de estilos base nunca se cargaba). La
# solución es listar AMBAS hojas, la del padre primero y la nuestra
# despues — Keycloak resuelve "css/login.css" subiendo la cadena de temas
# padres igual que ya hace con "stylesCommon", así que no hace falta
# copiar ese archivo a mano, solo nombrarlo aca.
parent=keycloak
import=common/keycloak
styles=css/login.css css/stoka-theme.css
scripts=js/stoka-back-link.js
